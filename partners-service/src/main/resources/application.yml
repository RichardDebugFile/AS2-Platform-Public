server:
  port: 8081

spring:
  application:
    name: partners-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partners}
    username: ${DB_USERNAME:partners}
    password: ${DB_PASSWORD:partners}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Un certificado ocupa unos pocos KB (HU-11).
      max-file-size: 64KB
      max-request-size: 128KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

partners:
  # Clave AES de 32 bytes en Base64 para la clave basica de los socios. Vacio = clave temporal (solo desarrollo).
  secret-key: ${PARTNERS_SECRET_KEY:}
  storage:
    # Raiz de las carpetas de los socios: <raiz>/<as2Name>/{Archive,Certs,Error,Incoming,MDN,Outgoing}.
    root: ${AS2_STORAGE_ROOT:/opt/as2_data/partners}
  shared:
    # Montaje del recurso compartido del ERP (Samba/CIFS): <montaje>/<carpeta del socio>/<subcarpeta>.
    root: ${AS2_SHARED_ROOT:/mnt/erp}
  certificates:
    # Retiro diario de los certificados caducados que ya tienen reemplazo vigente (HU-11).
    retire-cron: ${PARTNERS_CERT_RETIRE_CRON:0 30 6 * * *}
    zone: ${PARTNERS_CERT_ZONE:America/Guayaquil}
