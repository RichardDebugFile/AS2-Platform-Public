server:
  port: 8081

spring:
  application:
    name: partners-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partners}
    username: ${DB_USERNAME:partners}
    password: ${DB_PASSWORD:partners}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

partners:
  # Clave AES de 32 bytes en Base64 para la clave basica de los socios. Vacio = clave temporal (solo desarrollo).
  secret-key: ${PARTNERS_SECRET_KEY:}
  storage:
    # Raiz de las carpetas de los socios: <raiz>/<as2Name>/Outgoing|Incoming|MDN|Archive (HU-09).
    root: ${AS2_STORAGE_ROOT:/opt/as2_data/partners}
