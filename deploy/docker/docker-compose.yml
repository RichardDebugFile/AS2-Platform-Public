# Entorno de ejecucion contenerizado de la plataforma (HU-07).
#
#   ./init-env.sh                 # una vez: secretos (.env) y certificado TLS (certs/)
#   docker compose build          # construye las imagenes
#   ./prepare-storage.sh          # una vez: carpetas de los socios y del recurso compartido
#   docker compose up -d          # arranca
#   ./smoke-test.sh               # verifica HTTPS, puertos, reinicio, cookies y respaldo
#
# Solo el proxy TLS (nginx) publica puertos. Los servicios y PostgreSQL quedan en la red interna.
# Los demas servicios (documentos, alertas, AS2) se incorporan con sus historias.
name: as2-platform

x-restart: &restart
  restart: unless-stopped

# Rotacion de logs: sin ella crecen sin limite y acaban llenando el disco.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "14"

x-java-health: &java-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

# Origen de la consola para CORS. El navegador omite el puerto por defecto (Origin: https://localhost),
# asi que se admite con y sin puerto: con solo ":443" el login respondia "Invalid CORS request".
x-cors-origins: &cors-origins https://${SERVER_NAME:-localhost},https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}

services:
  db:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute init-env.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Ejecute init-env.sh}
      PARTNERS_DB_PASSWORD: ${PARTNERS_DB_PASSWORD:?Ejecute init-env.sh}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?Ejecute init-env.sh}
      ALERTS_DB_PASSWORD: ${ALERTS_DB_PASSWORD:?Ejecute init-env.sh}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../../db/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./db/10-service-passwords.sh:/docker-entrypoint-initdb.d/10-service-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  auth-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: as2-platform-services:local
    command: ["java", "-jar", "/app/auth-service.jar"]
    <<: [*restart, *logging]
    environment:
      DB_URL: jdbc:postgresql://db:5432/auth
      DB_USERNAME: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_ISSUER: http://auth-service:8083
      AUTH_JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM:?Ejecute init-env.sh}
      AUTH_JWT_PUBLIC_KEY_PEM: ${AUTH_JWT_PUBLIC_KEY_PEM:?Ejecute init-env.sh}
      AUTH_MFA_SECRET_KEY: ${AUTH_MFA_SECRET_KEY:?Ejecute init-env.sh}
      AUTH_CORS_ALLOWED_ORIGINS: *cors-origins
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ejecute init-env.sh}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      <<: *java-health
    networks: [backend]

  # Socios comerciales y su configuracion AS2 (HU-08).
  partners-service:
    image: as2-platform-services:local
    command: ["java", "-jar", "/app/partners-service.jar"]
    <<: [*restart, *logging]
    environment:
      DB_URL: jdbc:postgresql://db:5432/partners
      DB_USERNAME: partners
      DB_PASSWORD: ${PARTNERS_DB_PASSWORD}
      PARTNERS_SECRET_KEY: ${PARTNERS_SECRET_KEY:?Ejecute init-env.sh}
      AS2_STORAGE_ROOT: /opt/as2_data/partners
      AS2_SHARED_ROOT: /mnt/erp
    volumes:
      # Carpetas de los socios (HU-09): volumen propio, sobrevive a recrear el contenedor.
      - as2data:/opt/as2_data
      # Recurso compartido del ERP: en el servidor, la ruta donde esta montado (Samba/CIFS);
      # en local, ./shared. Preparar permisos con ./prepare-storage.sh.
      - ${ERP_SHARED_PATH:-./shared}:/mnt/erp
    depends_on:
      db: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      <<: *java-health
    networks: [backend]

  # Documentos EDI (HU-12) y su repositorio (HU-14): comparte el volumen de datos AS2 con
  # partners-service para escribir en las carpetas de cada socio, y le envia la bitacora.
  documents-service:
    image: as2-platform-services:local
    command: ["java", "-jar", "/app/documents-service.jar"]
    <<: [*restart, *logging]
    environment:
      DB_URL: jdbc:postgresql://db:5432/documents
      DB_USERNAME: documents
      DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD}
      AS2_DATA_ROOT: /opt/as2_data
      AS2_STORAGE_ROOT: /opt/as2_data/partners
      PARTNERS_SERVICE_URL: http://partners-service:8081
    volumes:
      - as2data:/opt/as2_data
      - ${ERP_SHARED_PATH:-./shared}:/mnt/erp
    depends_on:
      db: { condition: service_healthy }
      partners-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      <<: *java-health
    networks: [backend]

  # Certificados de prueba para la comunicacion AS2 (AS2-94 / AS2-100).
  as2-certs:
    image: eclipse-temurin:25-jre
    command: ["sh", "/interop/gen-certs.sh"]
    <<: [*logging]
    volumes:
      - ../interop/gen-certs.sh:/interop/gen-certs.sh:ro
      - as2certs:/certs
    networks: [backend]

  # Motor AS2 (HU-15): envio y recepcion de documentos EDI.
  as2-adapter:
    image: as2-platform-services:local
    command: ["java", "-jar", "/app/as2-adapter.jar"]
    <<: [*restart, *logging]
    environment:
      PARTNERS_SERVICE_URL: http://partners-service:8081
      AS2_SPIKE_ENABLED: "true"
      AS2_SPIKE_URL: http://openas2:10080
      AS2_SPIKE_FROM: PLATAFORMA
      AS2_SPIKE_TO: OPENAS2
      AS2_SPIKE_MDN_TO: edi.plataforma@example.com
      AS2_SPIKE_KEYSTORE: /certs/plataforma/plataforma.p12
      AS2_SPIKE_KEY_ALIAS: plataforma
      AS2_SPIKE_PARTNER_CERTIFICATE: /certs/plataforma/openas2.cer
      SPRING_CONFIG_IMPORT: "configtree:/certs/secrets/plataforma/"
    volumes:
      - as2certs:/certs:ro
    depends_on:
      as2-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      <<: *java-health
    networks: [backend]

  # Socio de prueba OpenAS2 (AS2-94 / AS2-100), activo solo con el perfil demo.
  openas2:
    profiles: ["demo"]
    build:
      context: https://github.com/OpenAS2/OpenAs2App.git#v4.15.0
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk-jammy AS builder
        WORKDIR /usr/src/openas2
        COPY . .
        RUN rm -f Server/dist/* Remote/dist/* Bundle/dist/* && ./mvnw -B -q clean package -DskipTests
        RUN mkdir Runtime && cd Runtime && jar xf ../Server/dist/OpenAS2Server-*.zip
        RUN cp start-container.sh Runtime/bin/ && chmod 755 Runtime/bin/*.sh && mv Runtime/config Runtime/config_template

        FROM eclipse-temurin:21-jre-jammy
        ENV OPENAS2_BASE=/opt/openas2 OPENAS2_HOME=/opt/openas2 OPENAS2_TMPDIR=/opt/openas2/temp
        COPY --from=builder /usr/src/openas2/Runtime/bin /opt/openas2/bin
        COPY --from=builder /usr/src/openas2/Runtime/lib /opt/openas2/lib
        COPY --from=builder /usr/src/openas2/Runtime/resources /opt/openas2/resources
        COPY --from=builder /usr/src/openas2/Runtime/config_template /opt/openas2/config_template
        RUN useradd --uid 1000 --gid 0 --home-dir /opt/openas2 --no-create-home --shell /usr/sbin/nologin openas2 \
            && mkdir -p /opt/openas2/config /opt/openas2/data /opt/openas2/logs /opt/openas2/temp \
            && chown -R 1000:0 /opt/openas2 && chmod -R g=u /opt/openas2
        USER 1000
        WORKDIR /opt/openas2
        ENTRYPOINT ["/opt/openas2/bin/start-container.sh"]
    entrypoint: ["sh", "/interop/start.sh"]
    tty: true
    <<: [*restart, *logging]
    depends_on:
      as2-certs:
        condition: service_completed_successfully
    volumes:
      - ../interop/openas2:/interop:ro
      - as2certs:/certs:ro
      - ./salida/openas2:/opt/openas2/data
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -Eqi ':2760 [0-9a-f]+:[0-9a-f]{4} 0a' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  gateway:
    image: as2-platform-services:local
    command: ["java", "-jar", "/app/gateway.jar"]
    <<: [*restart, *logging]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8083
      AUTH_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      PARTNERS_SERVICE_URL: http://partners-service:8081
      ALERTS_SERVICE_URL: http://alerts-service:8082
      DOCUMENTS_SERVICE_URL: http://documents-service:8084
      AS2_ADAPTER_URL: http://as2-adapter:8085
      # Inicio (AS2-99): servicios que este despliegue no incluye y que no se consultan.
      GATEWAY_STATUS_EXCLUDE: alerts
      APP_CORS_ALLOWED_ORIGINS: *cors-origins
    depends_on:
      auth-service: { condition: service_healthy }
      partners-service: { condition: service_healthy }
      documents-service: { condition: service_healthy }
      as2-adapter: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8765/actuator/health | grep -q UP"]
      <<: *java-health
    networks: [backend]

  # Proxy TLS y consola: unico servicio con puertos publicados.
  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    image: as2-platform-console:local
    <<: [*restart, *logging]
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1 y no localhost: nginx escucha solo IPv4 y localhost puede resolver a ::1.
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/ | grep -q 'id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]

  # Respaldo diario de las bases (pg_dump), con retencion de 7 dias.
  backup:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore-check.sh:/usr/local/bin/restore-check.sh:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

volumes:
  dbdata:
  as2data:
  as2certs:

networks:
  backend:
