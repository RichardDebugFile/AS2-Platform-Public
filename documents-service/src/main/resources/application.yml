server:
  port: 8084

spring:
  application:
    name: documents-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/documents}
    username: ${DB_USERNAME:documents}
    password: ${DB_PASSWORD:documents}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

documents:
  zone: ${DOCUMENTS_ZONE:America/Guayaquil}
  # Tamano maximo de un documento recibido por la ingesta (10 MB).
  max-size-bytes: ${DOCUMENTS_MAX_SIZE_BYTES:10485760}
  storage:
    # Repositorio en disco: <raiz>/{inbound|outbound}/{resultado}/AAAAMMDD/{tipo}/{socio}/EDI_...edi (HU-14).
    root: ${AS2_DATA_ROOT:/opt/as2_data}
  partners:
    # Carpetas de los socios que crea partners-service: <raiz>/<as2Name>/{Incoming,Archive,Error,...}.
    root: ${AS2_STORAGE_ROOT:/opt/as2_data/partners}
  recovery:
    # Restauracion de copias pendientes en la carpeta del socio (cada hora, ultimos 30 dias).
    cron: ${DOCUMENTS_RECOVERY_CRON:0 0 * * * *}
  audit:
    # Bitacora de partners-service (HU-10).
    url: ${PARTNERS_SERVICE_URL:http://localhost:8081}
