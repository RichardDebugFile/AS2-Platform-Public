# Análisis de calidad y cobertura en SonarQube Cloud (workflow .github/workflows/sonar.yml).
# La organización y la clave del proyecto pueden sobrescribirse con las variables del repositorio
# SONAR_ORGANIZATION y SONAR_PROJECT_KEY (Settings > Secrets and variables > Actions > Variables).
sonar.organization=richarddebugfile
sonar.projectKey=RichardDebugFile_TESIS-as2-platform
sonar.projectName=Plataforma AS2/EDI
sonar.sourceEncoding=UTF-8

# ---------- Código fuente y pruebas (6 servicios Java + consola web) ----------
sonar.sources=\
  gateway/src/main/java,\
  auth-service/src/main/java,\
  partners-service/src/main/java,\
  documents-service/src/main/java,\
  alerts-service/src/main/java,\
  as2-adapter/src/main/java,\
  frontend/src
sonar.tests=\
  gateway/src/test/java,\
  auth-service/src/test/java,\
  partners-service/src/test/java,\
  documents-service/src/test/java,\
  alerts-service/src/test/java,\
  as2-adapter/src/test/java,\
  frontend/src
# En frontend/src conviven código y pruebas: se separan por patrón.
sonar.test.inclusions=**/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,frontend/src/setupTests.ts

# ---------- Java ----------
sonar.java.source=25
sonar.java.binaries=\
  gateway/target/classes,\
  auth-service/target/classes,\
  partners-service/target/classes,\
  documents-service/target/classes,\
  alerts-service/target/classes,\
  as2-adapter/target/classes
sonar.java.test.binaries=\
  gateway/target/test-classes,\
  auth-service/target/test-classes,\
  partners-service/target/test-classes,\
  documents-service/target/test-classes,\
  alerts-service/target/test-classes,\
  as2-adapter/target/test-classes
# sonar.java.libraries se pasa desde el workflow (dependencias del repositorio local de Maven).

# ---------- Cobertura ----------
# Backend: informe XML de JaCoCo que genera `mvn verify` en cada módulo.
sonar.coverage.jacoco.xmlReportPaths=\
  gateway/target/site/jacoco/jacoco.xml,\
  auth-service/target/site/jacoco/jacoco.xml,\
  partners-service/target/site/jacoco/jacoco.xml,\
  documents-service/target/site/jacoco/jacoco.xml,\
  alerts-service/target/site/jacoco/jacoco.xml,\
  as2-adapter/target/site/jacoco/jacoco.xml
# Frontend: LCOV que genera `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Clases de arranque sin lógica: no cuentan para la cobertura.
sonar.coverage.exclusions=**/*Application.java,frontend/src/main.tsx
