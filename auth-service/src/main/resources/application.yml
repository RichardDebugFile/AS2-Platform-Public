server:
  port: 8083

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:auth}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  issuer: ${AUTH_ISSUER:http://localhost:8083}
  # Vida de la sesion: manda el limite que llegue antes (ver SessionPolicy).
  # access-ttl-min: corto a proposito. Los demas servicios solo validan firma y caducidad del access
  #   token, asi que es el tiempo maximo que conserva acceso un usuario desactivado.
  access-ttl-min: ${AUTH_ACCESS_TTL_MIN:5}
  # idle-timeout-min: sin actividad durante este tiempo, la sesion se cierra.
  idle-timeout-min: ${AUTH_IDLE_TIMEOUT_MIN:15}
  # session-max-min: techo absoluto desde el login. Renovar el token no lo mueve.
  session-max-min: ${AUTH_SESSION_MAX_MIN:60}
  # Par RSA en PEM (PKCS#8 / X.509). Vacio = se genera al arrancar (solo desarrollo).
  rsa:
    private-pem: ${AUTH_JWT_PRIVATE_KEY_PEM:}
    public-pem: ${AUTH_JWT_PUBLIC_KEY_PEM:}
  mfa:
    # Clave AES de 32 bytes en Base64. Vacio = clave temporal (solo desarrollo).
    secret-key: ${AUTH_MFA_SECRET_KEY:}
    # Nombre con el que aparece la cuenta en la app autenticadora.
    issuer-label: ${AUTH_MFA_ISSUER_LABEL:AS2 Platform}
    challenge-ttl-sec: ${AUTH_MFA_CHALLENGE_TTL_SEC:300}
    max-attempts: ${AUTH_MFA_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Administrador inicial: se crea solo si no existe.
seed:
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # traceId en cada linea (lo pone TraceContextFilter) para seguir una peticion entre servicios
    level: "%5p [%X{traceId:-}]"
