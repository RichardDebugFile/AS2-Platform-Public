server:
  port: 8085

spring:
  application:
    name: as2-adapter

as2:
  audit:
    # Bitacora de partners-service (HU-10). En Docker: http://partners-service:8081
    url: ${PARTNERS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Solo el nombre y estado de cada verificacion (db, disco...), sin detalles: el gateway los
      # muestra en Estado del sistema de la consola (AS2-99).
      show-components: always
