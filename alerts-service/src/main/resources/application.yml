server:
  port: 8082

spring:
  application:
    name: alerts-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alerts}
    username: ${DB_USERNAME:alerts}
    password: ${DB_PASSWORD:alerts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Solo el nombre y estado de cada verificacion (db, disco...), sin detalles: el gateway los
      # muestra en Estado del sistema de la consola (AS2-99).
      show-components: always

alerts:
  # Clave AES-256 (32 bytes en Base64) con la que se cifra la contrasena SMTP. La genera init-env.sh.
  secret-key: ${ALERTS_SECRET_KEY:}
  audit:
    # Bitacora de partners-service (HU-10).
    url: ${PARTNERS_SERVICE_URL:http://localhost:8081}
  mail:
    # Tiempo maximo para conectar, leer y escribir con el servidor SMTP.
    timeout-ms: ${ALERTS_MAIL_TIMEOUT_MS:10000}
