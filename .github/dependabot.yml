version: 2
# PAUSADO (open-pull-requests-limit: 0): las versiones se actualizan de forma planificada, en una
# rama propia y con todas las pruebas, no con un PR automatico por dependencia. Las alertas de
# vulnerabilidades de GitHub siguen activas (pestana Security) y no abren PRs.
#
# Para reactivar: Maven 3, npm 2, GitHub Actions 5 (su valor por defecto).
#
# Minor/patch agrupados y contra develop. Los majors no se proponen: son migraciones que se
# planifican como historia propia. Sin rebase automatico para no relanzar el CI de todos los PRs
# abiertos en cada merge.
updates:
  - package-ecosystem: maven
    directory: "/"
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    rebase-strategy: disabled
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
