version: 2
# Minor/patch agrupados y contra develop. Los majors (Spring Boot 4, React 20...) no se proponen:
# son migraciones que se planifican como historia propia. Sin rebase automatico para no
# relanzar el CI de todos los PRs abiertos en cada merge.
updates:
  - package-ecosystem: maven
    directory: "/"
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
