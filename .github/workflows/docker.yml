name: Docker

# Entorno contenerizado (HU-07): construye las imagenes, levanta el stack completo con el socio de
# prueba OpenAS2 (perfil demo) y verifica los criterios de aceptacion con deploy/docker/smoke-test.sh
# (HTTPS, puertos, reinicio automatico, cookies Secure, respaldo restaurable y carpetas de los socios).
# Despues corre con Newman las colecciones de Postman de todos los servicios contra el stack (AS2-101).
# Corre cuando cambia el despliegue o una coleccion.

permissions:
  contents: read

on:
  push:
    paths:
      - 'deploy/docker/**'
      - '*/postman/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'deploy/docker/**'
      - '*/postman/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Stack Docker + criterios HU-07
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # OpenAS2 como socio de prueba: la coleccion del as2-adapter hace un envio AS2 de punta a punta.
      COMPOSE_PROFILES: demo
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@v7

      - name: Secretos y certificado de prueba
        id: init
        run: ./init-env.sh

      - name: Construir imagenes
        id: build
        run: docker compose build 2>&1 | tee /tmp/build.log

      - name: Almacenamiento de las carpetas de los socios
        id: storage
        run: ./prepare-storage.sh

      - name: Levantar
        id: up
        run: docker compose up -d --wait --wait-timeout 300

      - name: Criterios de aceptacion
        run: ./smoke-test.sh

      # La contrasena del admin la genera init-env.sh en cada corrida; se enmascara en los logs. De la
      # coleccion de partners se omite "Carpetas" (necesita la carpeta compartida del ERP montada en
      # el equipo) y "Motor AS2 (red interna)" (rutas /internal que el gateway no publica).
      - name: API con Newman (colecciones de Postman)
        working-directory: .
        run: |
          pw="$(grep '^ADMIN_PASSWORD=' deploy/docker/.env | cut -d= -f2-)"
          echo "::add-mask::$pw"
          # Corre todas aunque alguna falle, para ver en un solo intento que colecciones fallan.
          rc=0
          coleccion() {
            echo "::group::$1"
            npx -y newman@6.2.1 run "$1" --insecure --reporters cli \
              --env-var host=https://localhost --env-var adminUser=admin --env-var "adminPassword=$pw" "${@:2}" \
              || { rc=1; echo "::error title=Newman::$1"; }
            echo "::endgroup::"
          }
          coleccion gateway/postman/gateway.postman_collection.json
          coleccion auth-service/postman/auth-service.postman_collection.json
          coleccion documents-service/postman/documents-service.postman_collection.json
          coleccion as2-adapter/postman/as2-adapter.postman_collection.json
          coleccion partners-service/postman/partners-service.postman_collection.json \
            --folder "Sesión (vía gateway)" --folder Socios --folder Bitácora --folder Certificados
          exit $rc

      # Los logs de Actions solo se ven con sesion iniciada: ante un fallo, el paso que fallo y las
      # ultimas lineas utiles quedan tambien como anotaciones del job (visibles en el resumen).
      - name: Diagnostico ante un fallo
        if: failure()
        run: |
          echo "::error title=Pasos::init=${{ steps.init.outcome }} build=${{ steps.build.outcome }} storage=${{ steps.storage.outcome }} up=${{ steps.up.outcome }}"
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            grep -iE 'error|failed' /tmp/build.log | tail -n 15 | while IFS= read -r l; do echo "::error title=build::$l"; done
          fi
          # Las anotaciones tienen un tope de 10 por tipo y paso: estado en una linea y logs solo de
          # los servicios que no estan sanos.
          echo "::notice title=ps::$(docker compose ps -a --format '{{.Service}}={{.Status}}' | paste -sd ';' -)"
          for s in $(docker compose ps -a --format '{{.Service}} {{.Status}}' | grep -v '(healthy)' | grep -v '^backup ' | cut -d' ' -f1); do
            docker compose logs --no-color --tail 8 "$s" 2>/dev/null | while IFS= read -r l; do echo "::warning title=$s::$l"; done
          done
          docker compose logs --tail 150 || true

      - name: Detener
        if: always()
        run: docker compose down -v
